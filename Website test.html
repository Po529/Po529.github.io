<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Website Outline</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      scroll-behavior: smooth;
    }

    header {
      background: #333;
      color: white;
      padding: 1rem 0;
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 1000;
    }

    nav {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
    }

    nav a:hover {
      text-decoration: underline;
    }

    section {
      padding: 100px 20px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .hero {
      background: #f4f4f4;
      padding-top: 150px;
      text-align: center;
    }

    .hero h1 {
      font-size: 3rem;
    }

    footer {
      text-align: center;
      padding: 2rem;
      background: #333;
      color: white;
      margin-top: 2rem;
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <div class="logo">MySite</div>
      <div>
        <a href="#hero">Home</a>
        <a href="#about">About</a>
        <a href="#services">Services</a>
        <a href="#contact">Contact</a>
      </div>
    </nav>
  </header>

  <section id="hero" class="hero">
    <h1>Welcome to My Website</h1>
    <p>This is a hero section.</p>
  </section>

  <section id="about">
    <h2>About Us</h2>
    <p>Some text about the company or website purpose.</p>
  </section>

  <section id="services">
    <h2>Our Services</h2>
    <p>Overview of services offered.</p>
  </section>

  <section id="contact">
    <h2>Contact</h2>
    <p>Email us at contact@example.com</p>
  </section>

  <footer>
    <p>&copy; 2025 MySite. All rights reserved.</p>
  </footer>

</body>
</html>
